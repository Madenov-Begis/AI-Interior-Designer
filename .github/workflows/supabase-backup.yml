name: Supabase encrypted backup

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      storage_restore_check:
        description: Upload, download and remove one temporary Storage object
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RESTORED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Dump database over verified TLS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .backup
          cp prisma/certs/supabase-root-2021.crt .backup/supabase-root-2021.crt
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=verify-full \
            -e PGSSLROOTCERT=/work/supabase-root-2021.crt \
            -v "$PWD/.backup:/work" \
            postgres:17 \
            sh -ceu 'pg_dump "$SUPABASE_DATABASE_URL" --format=custom --no-owner --no-acl --schema=public --file=/work/public.dump'
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=verify-full \
            -e PGSSLROOTCERT=/work/supabase-root-2021.crt \
            -v "$PWD/.backup:/work" \
            postgres:17 \
            sh -ceu 'pg_dump "$SUPABASE_DATABASE_URL" --format=custom --data-only --no-owner --no-acl --schema=auth --schema=storage --exclude-table=auth.schema_migrations --exclude-table=storage.migrations --file=/work/auth-storage.dump'

      - name: Restore and verify public database data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17 \
            psql --host=127.0.0.1 --username=postgres --dbname=restore_test --set=ON_ERROR_STOP=1 \
            --command='drop schema public cascade; create role anon; create role authenticated; create role service_role; create schema auth; create function auth.uid() returns uuid language sql stable as $$select null::uuid$$;'
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD/.backup:/work" \
            postgres:17 \
            pg_restore --host=127.0.0.1 --username=postgres --dbname=restore_test --no-owner --no-acl /work/public.dump
          node scripts/verify-database-backup.mjs

      - name: Back up Storage and verify checksums
        shell: bash
        env:
          STORAGE_RESTORE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_restore_check }}
        run: |
          set -euo pipefail
          args=(.backup/storage)
          if [ "$STORAGE_RESTORE_CHECK" = "true" ]; then
            args+=(--restore-check)
          fi
          node scripts/backup-supabase-storage.mjs "${args[@]}"

      - name: Encrypt and verify archive
        shell: bash
        run: |
          set -euo pipefail
          backup_name="supabase-production-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p backup-artifacts
          tar -C .backup -czf "backup-artifacts/${backup_name}.tar.gz" public.dump auth-storage.dump storage storage-manifest.json
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "backup-artifacts/${backup_name}.tar.gz" \
            -out "backup-artifacts/${backup_name}.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "backup-artifacts/${backup_name}.tar.gz.enc" \
            -out "backup-artifacts/${backup_name}.verified.tar.gz" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          tar -tzf "backup-artifacts/${backup_name}.verified.tar.gz" >/dev/null
          sha256sum "backup-artifacts/${backup_name}.tar.gz.enc" > "backup-artifacts/${backup_name}.sha256"
          rm "backup-artifacts/${backup_name}.tar.gz" "backup-artifacts/${backup_name}.verified.tar.gz"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-production-backup-${{ github.run_id }}
          path: backup-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
