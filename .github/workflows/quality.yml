name: Pull request quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruvie_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ruvie_refactor_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ruvie_test -d ruvie_refactor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ruvie_test:local-test-only@127.0.0.1:55432/ruvie_refactor_test
      DIRECT_URL: postgresql://ruvie_test:local-test-only@127.0.0.1:55432/ruvie_refactor_test
      DATABASE_URL: postgresql://ruvie_test:local-test-only@127.0.0.1:55432/ruvie_refactor_test
      DATABASE_SSL_MODE: disable
      APP_URL: https://example.invalid
      APP_ORIGINS: https://example.invalid
      ADMIN_ORIGINS: https://admin.example.invalid
      AUTH_COOKIE_DOMAIN: .example.invalid
      ADMIN_ACCESS_CODE: ci-only-test-code
      ADMIN_TOKEN_SECRET: ci-only-signing-secret-with-at-least-32-characters
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      GOOGLE_OAUTH_CLIENT_ID: ci.example.invalid
      GOOGLE_OAUTH_CLIENT_SECRET: ci-only-oauth-secret
      GOOGLE_OAUTH_CALLBACK_URL: https://example.invalid/auth/callback
      STORAGE_ROOT: /tmp/ruvie-ci-media
      STORAGE_PUBLIC_ORIGIN: https://example.invalid
      STORAGE_SIGNING_SECRET: ci-only-storage-secret-with-at-least-32-characters
      NEXT_PUBLIC_API_BASE_URL: https://example.invalid
      AI_PROVIDER: fake
      PAYMENT_PROVIDER: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm test:integration
      - run: pnpm legal:check
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm admin:test
      - run: pnpm admin:typecheck
      - run: pnpm admin:build
