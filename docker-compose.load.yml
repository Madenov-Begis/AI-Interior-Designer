name: ruvie-load-test
x-env: &load-env
  NODE_ENV: production
  APP_URL: http://localhost:3101
  APP_ORIGINS: http://localhost:3101
  ADMIN_ORIGINS: http://localhost:3102
  DATABASE_URL: postgresql://ruvie_test:local-test-only@load-db:5432/ruvie_refactor_test
  DIRECT_URL: postgresql://ruvie_test:local-test-only@load-db:5432/ruvie_refactor_test
  DATABASE_SSL_MODE: disable
  AI_PROVIDER: fake
  LOAD_TEST_MODE: "true"
  FAKE_SCENARIO: ${LOAD_SCENARIO:-delay}
  PAYMENT_PROVIDER: disabled
  AUTH_SESSION_SECRET: load-test-session-secret-not-for-production
  GOOGLE_OAUTH_CLIENT_ID: local-preview.invalid
  GOOGLE_OAUTH_CLIENT_SECRET: local-preview-only
  GOOGLE_OAUTH_CALLBACK_URL: http://localhost:3101/auth/callback
  ADMIN_ACCESS_CODE: load-test-only
  ADMIN_TOKEN_SECRET: load-test-admin-secret-not-for-production
  STORAGE_SIGNING_SECRET: load-test-storage-secret-not-for-production
  STORAGE_ROOT: /data/media
  STORAGE_PUBLIC_ORIGIN: http://localhost:3101
  WORKER_MODE: ${LOAD_WORKER_MODE:-fixed}
  WORKER_CONCURRENCY: "10"
  WORKER_ADAPTIVE_INITIAL: "10"
  WORKER_ADAPTIVE_MAX: "20"
  WORKER_MEMORY_MB: "2048"
services:
  load-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ruvie_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: ruvie_refactor_test
    volumes: [load_database:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruvie_test -d ruvie_refactor_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: ruvie-load-test-worker
    build: { context: ., target: worker }
    environment: *load-env
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      load-db: { condition: service_healthy }
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3101
        STORAGE_PUBLIC_ORIGIN: http://localhost:3101
    environment: *load-env
    ports: ["127.0.0.1:3101:3000"]
    volumes: [load_media:/data/media]
    mem_limit: 3g
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    image: ruvie-load-test-worker
    build: { context: ., target: worker }
    environment: *load-env
    volumes: [load_media:/data/media]
    mem_limit: 2g
    stop_grace_period: 240s
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
  seed:
    image: ruvie-load-test-worker
    build: { context: ., target: worker }
    environment:
      <<: *load-env
      LOAD_USERS: ${LOAD_USERS:-100}
      LOAD_OUTPUT: /fixtures
    volumes: [load_media:/data/media, load_fixtures:/fixtures]
    # Именованный volume fixtures создаётся Docker от root; только изолированный seed.
    user: root
    command: ["sh", "-c", "pnpm exec esbuild scripts/load/seed.ts --bundle --platform=node --format=esm --packages=external --alias:server-only=./scripts/server-only-empty.js --outfile=/app/load-seed.mjs && node /app/load-seed.mjs && chown -R node:node /data/media /fixtures"]
    profiles: [tools]
    depends_on:
      migrate: { condition: service_completed_successfully }
  k6:
    image: grafana/k6:1.3.0
    user: root
    environment:
      LOAD_USERS: ${LOAD_USERS:-20}
      LOAD_BASE_URL: http://web:3000
      LOAD_UPLOADS: ${LOAD_UPLOADS:-false}
      LOAD_STEADY: ${LOAD_STEADY:-false}
      EXPECT_FAILURE: ${EXPECT_FAILURE:-false}
    volumes: ["./scripts/load:/scripts:ro", "load_fixtures:/fixtures"]
    command: ["run", "/scripts/generations.js"]
    profiles: [tools]
volumes:
  load_database:
  load_media:
  load_fixtures:
